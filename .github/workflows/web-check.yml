name: Web Check

# Typecheck, testes e build do app web (app/) em cada push/PR que tocar o
# frontend. Garante que a saúde do código (tsc zerado, build verde) não regrida.

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/web-check.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/web-check.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Tests
        run: npm run test

      - name: Build client
        run: npm run build:client
