<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#313338" />
    <meta
      name="description"
      content="Nexora - plataforma de comunicação moderna em tempo real com servidores, canais de texto, voz e compartilhamento de tela."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Nexora - Converse em tempo real</title>
  </head>
  <body
    class="bg-[#313338] text-[#F2F3F5] antialiased selection:bg-[#5865F2]/30 selection:text-white"
    style="background: #313338; color: #f2f3f5"
  >
    <div id="root" style="height: 100dvh">
      <div
        class="min-h-[100dvh] flex flex-col items-center justify-center bg-[#313338] text-white select-none"
        style="height: 100%"
        aria-busy="true"
      >
        <div
          class="animate-pulse"
          style="
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
          "
        >
          <span style="font-size: 20px; font-weight: 900; color: white">N</span>
        </div>
        <p class="text-[#B5BAC1] text-sm" role="status">Carregando Nexora...</p>
        <style>
          @keyframes pulse {
            0%,
            100% {
              opacity: 1;
            }
            50% {
              opacity: 0.5;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
