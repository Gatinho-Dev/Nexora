<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      // Avoid theme flash: apply saved preference before first paint.
      try {
        var t = localStorage.getItem("nexora-theme") || "dark";
        var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = t === "system" ? sysDark : t === "dark";
        document.documentElement.classList.toggle("dark", dark);
        if (localStorage.getItem("nexora-reduce-motion") === "1") {
          document.documentElement.classList.add("reduce-motion");
        }
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E1F22" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexora" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta
      name="description"
      content="Nexora - plataforma de comunicação moderna em tempo real com servidores, canais de texto, voz e compartilhamento de tela."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Nexora - Converse em tempo real</title>
  </head>
  <body
    class="bg-background text-foreground antialiased selection:bg-[#5865F2]/30 selection:text-white"
    style="background: #313338; color: #f2f3f5"
  >
    <div id="root" style="height: 100dvh">
      <div
        class="min-h-[100dvh] flex flex-col items-center justify-center bg-background text-foreground select-none"
        style="height: 100%"
        aria-busy="true"
      >
        <img
          class="animate-pulse"
          src="/icon.svg"
          alt="Nexora"
          width="56"
          height="56"
          style="width: 56px; height: 56px; margin-bottom: 16px"
        />
        <p class="text-[#B5BAC1] text-sm" role="status">Carregando Nexora...</p>
        <style>
          @keyframes pulse {
            0%,
            100% {
              opacity: 1;
            }
            50% {
              opacity: 0.5;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
