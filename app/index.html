<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11131A" />
    <meta name="description" content="Nexora — plataforma de comunicação moderna em tempo real com servidores, canais de texto, voz e compartilhamento de tela." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Nexora — Converse em tempo real</title>
  </head>
  <body class="bg-[#11131A] text-[#F2F3F5] antialiased selection:bg-[#6574FF]/30 selection:text-white" style="background:#11131A;color:#F2F3F5;">
    <div id="root" style="height:100vh;" suppressHydrationWarning>
      <div class="min-h-screen flex flex-col items-center justify-center bg-[#11131A] text-white select-none" style="height:100%;">
        <div class="h-16 w-16 rounded-2xl bg-gradient-to-tr from-[#6574FF] to-[#8A5CFF] p-0.5 animate-pulse shadow-2xl shadow-[#6574FF]/30 mb-4" style="width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#6574FF,#8A5CFF);display:flex;align-items:center;justify-content:center;animation:pulse 1.5s ease-in-out infinite;margin-bottom:16px;">
          <div class="h-full w-full bg-[#171923] rounded-2xl flex items-center justify-center font-extrabold text-2xl text-[#6574FF]" style="width:100%;height:100%;background:#171923;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#6574FF;">N</div>
        </div>
        <p class="text-[#A8ACB8] text-sm">Carregando Nexora...</p>
        <style>@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
