<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cider 2">
  <defs>
    <!-- Identidade Cider 2: gradiente "cidra" (âmbar → magenta → violeta). -->
    <linearGradient id="ciderJuice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb547"/>
      <stop offset="42%" stop-color="#ff5f6d"/>
      <stop offset="100%" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="ciderLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8affc1"/>
      <stop offset="100%" stop-color="#22d3a6"/>
    </linearGradient>
    <radialGradient id="ciderGlow" cx="30%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- App tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#ciderJuice)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#ciderGlow)"/>
  <!-- Maçã (silhueta própria, sem referência a marcas de terceiros) -->
  <path d="M256 176c-34-34-92-30-116 12-28 48-6 148 44 196 26 25 48 22 72 12 24 10 46 13 72-12 50-48 72-148 44-196-24-42-82-46-116-12z"
        fill="#0e0b18" fill-opacity="0.86"/>
  <!-- Equalizador dentro da maçã: "som + cidra" -->
  <g fill="#ffffff">
    <rect x="180" y="286" width="26" height="60" rx="13" opacity="0.92"/>
    <rect x="218" y="252" width="26" height="94" rx="13" opacity="0.98"/>
    <rect x="256" y="228" width="26" height="118" rx="13" opacity="1"/>
    <rect x="294" y="252" width="26" height="94" rx="13" opacity="0.98"/>
    <rect x="332" y="286" width="26" height="60" rx="13" opacity="0.92"/>
  </g>
  <!-- Folha + cabo -->
  <path d="M262 168c2-30 24-56 56-64 6 30-16 60-50 66z" fill="url(#ciderLeaf)"/>
  <path d="M252 176c-2-26 6-52 22-72" stroke="#0e0b18" stroke-opacity="0.5"
        stroke-width="16" stroke-linecap="round" fill="none"/>
</svg>
