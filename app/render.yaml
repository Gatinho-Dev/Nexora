services:
  - type: web
    name: nexora
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: KIMI_AUTH_URL
        sync: false
      - key: KIMI_OPEN_URL
        sync: false
      - key: OWNER_UNION_ID
        sync: false
      - key: NEXORA_OWNER_USER_IDS
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SAFETY_MODEL
        value: nvidia/nemotron-3.5-content-safety:free
      - key: OPENROUTER_VISION_MODEL
        value: nvidia/nemotron-3.5-content-safety:free
      - key: SAFETY_AI_ENABLED
        value: true
      - key: TEXT_MODERATION_ENABLED
        value: true
      - key: IMAGE_MODERATION_ENABLED
        value: true
      - key: REPORT_AI_TRIAGE_ENABLED
        value: true
      - key: AUTOMATIC_SEVERE_SUSPENSION_ENABLED
        value: true
      - key: SAFETY_SHADOW_MODE
        value: false
      - key: ROBLOX_CLIENT_ID
        sync: false
      - key: ROBLOX_CLIENT_SECRET
        sync: false
      - key: ROBLOX_REDIRECT_URI
        value: https://nexorachat.cloud/api/integrations/roblox/callback
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        value: https://nexorachat.cloud/api/integrations/spotify/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://nexorachat.cloud/api/integrations/youtube/callback
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: TWITCH_REDIRECT_URI
        value: https://nexorachat.cloud/api/integrations/twitch/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://nexorachat.cloud/api/integrations/github/callback
