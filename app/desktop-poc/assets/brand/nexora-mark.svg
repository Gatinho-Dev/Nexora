<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Nexora</title>
  <!--
    The Nexora mark is a single, continuous relay: a message enters one side,
    crosses the network, and arrives at the other. Its simple silhouette keeps
    the N readable at small interface and notification sizes.
  -->
